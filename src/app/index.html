<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tamagotchi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <!-- 1. Start -->
    <section id="screen-start" class="screen active">
      <span class="logo-icon">👾</span>
      <div>
        <h1 class="app-title">Tamagotchi</h1>
        <p class="app-subtitle" data-i18n="start_subtitle">A little friend on your desktop</p>
      </div>
      <button id="start-btn" class="btn" data-i18n="start_button">Start</button>
      <div class="lang-group">
        <button class="lang-btn" data-lang="en">EN</button>
        <button class="lang-btn" data-lang="ja">JP</button>
        <button class="lang-btn" data-lang="ko">KO</button>
      </div>
    </section>

    <!-- 2. Character select -->
    <section id="screen-select" class="screen">
      <h2 class="screen-heading" data-i18n="select_heading">Choose your friend</h2>
      <div class="character-grid">
        <div class="char-card" data-char="pink">
          <div class="char-preview pink-preview"></div>
          <div class="char-info">
            <span class="char-name">Pinky</span>
            <span class="char-desc" data-i18n="pink_desc">Cheerful and loves adventure</span>
          </div>
          <div class="select-badge">✓</div>
        </div>
        <div class="char-card" data-char="owlet">
          <div class="char-preview owlet-preview"></div>
          <div class="char-info">
            <span class="char-name">Owlet</span>
            <span class="char-desc" data-i18n="owlet_desc">Gentle and loves reading books</span>
          </div>
          <div class="select-badge">✓</div>
        </div>
        <div class="char-card" data-char="dude">
          <div class="char-preview dude-preview"></div>
          <div class="char-info">
            <span class="char-name">Dudy</span>
            <span class="char-desc" data-i18n="dude_desc">Curious and full of mischief</span>
          </div>
          <div class="select-badge">✓</div>
        </div>
      </div>
      <div class="select-footer">
        <button id="select-back" class="btn ghost" data-i18n="back_button">Back</button>
        <button id="select-confirm" class="btn" data-i18n="confirm_button">Let's play</button>
      </div>
    </section>

    <!-- 3. Pet room -->
    <section id="screen-room" class="screen">
      <div class="room-topbar">
        <button id="room-back" class="icon-btn" title="Change character">‹</button>
        <span class="pet-name" id="room-pet-name">Pinky</span>
      </div>

      <div class="stats">
        <div class="stat stat-hp">
          <span class="stat-icon">❤️</span>
          <div class="stat-track"><div class="stat-fill" id="fill-hp"></div></div>
          <span class="stat-val" id="val-hp">100</span>
        </div>
        <div class="stat stat-satiety">
          <span class="stat-icon">🍖</span>
          <div class="stat-track"><div class="stat-fill" id="fill-satiety"></div></div>
          <span class="stat-val" id="val-satiety">100</span>
        </div>
        <div class="stat stat-stamina">
          <span class="stat-icon">🔋</span>
          <div class="stat-track"><div class="stat-fill" id="fill-stamina"></div></div>
          <span class="stat-val" id="val-stamina">--</span>
        </div>
      </div>

      <!-- Field Swiper -->
      <div class="field-swiper" id="field-swiper">
        <button class="swiper-btn" id="swiper-prev">‹</button>
        <span class="swiper-label" id="swiper-label" data-i18n="field_basic">Basic Field</span>
        <button class="swiper-btn" id="swiper-next">›</button>
      </div>

      <!-- Center views -->
      <div class="stage" id="stage">
        <div class="bubble" id="bubble"></div>
        <div class="pet" id="pet"></div>
      </div>

      <div class="menu-view" id="shop-view" style="display: none;">
        <div class="menu-view-content">
          <span class="menu-icon">🛒</span>
          <h2 class="menu-title" data-i18n="shop_title">Shop</h2>
          <p class="menu-desc" data-i18n="under_construction">Under Construction...</p>
        </div>
      </div>

      <div class="menu-view" id="alarm-view" style="display: none;">
        <div class="menu-view-content">
          <span class="menu-icon">⏰</span>
          <h2 class="menu-title" data-i18n="alarm_title">Alarm</h2>
          <p class="menu-desc" data-i18n="under_construction">Under Construction...</p>
        </div>
      </div>

      <!-- Bottom action button groups -->
      <div class="actions-container">
        <!-- Actions for Basic Field -->
        <div class="actions-group active" id="actions-basic">
          <button class="btn btn-alarm" data-action="alarm" data-i18n="btn_alarm">⏰ Alarm</button>
          <button class="btn btn-shop" data-action="shop" data-i18n="btn_shop">🛒 Shop</button>
          <button class="btn btn-feed" id="btn-feed" data-i18n="feed_button">🍖 Feed</button>
        </div>

        <!-- Actions for Game Field -->
        <div class="actions-group" id="actions-game">
          <button class="btn btn-alarm" data-action="alarm" data-i18n="btn_alarm">⏰ Alarm</button>
          <button class="btn btn-shop" data-action="shop" data-i18n="btn_shop">🛒 Shop</button>
          <button class="btn btn-play" id="btn-play" data-i18n="play_button">🎮 Play</button>
        </div>

        <!-- Actions for Shop Screen -->
        <div class="actions-group actions-split-2" id="actions-shop">
          <button class="btn btn-alarm" data-action="alarm" data-i18n="btn_alarm">⏰ Alarm</button>
          <button class="btn btn-field" data-action="field" data-i18n="btn_field">🏡 Field</button>
        </div>

        <!-- Actions for Alarm Screen -->
        <div class="actions-group actions-split-2" id="actions-alarm">
          <button class="btn btn-shop" data-action="shop" data-i18n="btn_shop">🛒 Shop</button>
          <button class="btn btn-field" data-action="field" data-i18n="btn_field">🏡 Field</button>
        </div>
      </div>
    </section>

    <!-- shared pet engine + app -->
    <script src="../desktop/chrome-shim.js"></script>
    <script src="../content/sprite.js"></script>
    <script src="../content/pet.js"></script>
    <script src="../content/input.js"></script>
    <script src="stats.js"></script>
    <script src="room.js"></script>
    <script src="app.js"></script>
  </body>
</html>
