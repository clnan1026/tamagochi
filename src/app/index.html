<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tamagotchi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <!-- 1. Start -->
    <section id="screen-start" class="screen active">
      <span class="logo-icon">👾</span>
      <div>
        <h1 class="app-title">Tamagotchi</h1>
        <p class="app-subtitle" data-i18n="start_subtitle">A little friend on your desktop</p>
      </div>
      <button id="start-btn" class="btn" data-i18n="start_button">Start</button>
      <div class="lang-group">
        <button class="lang-btn" data-lang="en">EN</button>
        <button class="lang-btn" data-lang="ja">JP</button>
        <button class="lang-btn" data-lang="ko">KO</button>
      </div>
    </section>

    <!-- 2. Character select -->
    <section id="screen-select" class="screen">
      <h2 class="screen-heading" data-i18n="select_heading">Choose your friend</h2>
      <div class="character-grid">
        <div class="char-card" data-char="pink">
          <div class="char-preview pink-preview"></div>
          <div class="char-info">
            <span class="char-name">Pinky</span>
            <span class="char-desc" data-i18n="pink_desc">Cheerful and loves adventure</span>
          </div>
          <div class="select-badge">✓</div>
        </div>
        <div class="char-card" data-char="owlet">
          <div class="char-preview owlet-preview"></div>
          <div class="char-info">
            <span class="char-name">Owlet</span>
            <span class="char-desc" data-i18n="owlet_desc">Gentle and loves reading books</span>
          </div>
          <div class="select-badge">✓</div>
        </div>
        <div class="char-card" data-char="dude">
          <div class="char-preview dude-preview"></div>
          <div class="char-info">
            <span class="char-name">Dudy</span>
            <span class="char-desc" data-i18n="dude_desc">Curious and full of mischief</span>
          </div>
          <div class="select-badge">✓</div>
        </div>
      </div>
      <div class="select-footer">
        <button id="select-back" class="btn ghost" data-i18n="back_button">Back</button>
        <button id="select-confirm" class="btn" data-i18n="confirm_button">Let's play</button>
      </div>
    </section>

    <!-- 3. Pet room -->
    <section id="screen-room" class="screen">
      <div class="room-topbar">
        <button id="room-back" class="icon-btn" title="Change character">‹</button>
        <span class="pet-name" id="room-pet-name">Pinky</span>
        <button id="room-pomodoro" class="icon-btn" title="Pomodoro">⏰</button>
      </div>

      <div class="stats">
        <div class="stat stat-hp">
          <span class="stat-icon">❤️</span>
          <div class="stat-track"><div class="stat-fill" id="fill-hp"></div></div>
          <span class="stat-val" id="val-hp">100</span>
        </div>
        <div class="stat stat-satiety">
          <span class="stat-icon">🍖</span>
          <div class="stat-track"><div class="stat-fill" id="fill-satiety"></div></div>
          <span class="stat-val" id="val-satiety">100</span>
        </div>
        <div class="stat stat-stamina">
          <span class="stat-icon">🔋</span>
          <div class="stat-track"><div class="stat-fill" id="fill-stamina"></div></div>
          <span class="stat-val" id="val-stamina">--</span>
        </div>
      </div>

      <div class="stage" id="stage">
        <span class="decor left">🪴</span>
        <span class="decor right">🧸</span>
        <div class="dust" id="dust"></div>
        <div class="rock" id="rock" title="tap to reset"></div>
        <div class="bubble" id="bubble"></div>
        <div class="task-tag" id="task-tag"></div>
        <div class="pet" id="pet"></div>
        <div class="gameover" id="gameover" hidden>
          <div class="gameover-card">
            <span class="gameover-emoji">💫</span>
            <p class="gameover-msg" data-i18n="fainted_msg">Your friend fainted…</p>
            <button id="btn-revive" class="btn" data-i18n="revive_button">Revive</button>
          </div>
        </div>
      </div>

      <div class="actions">
        <button id="btn-feed" class="btn" data-i18n="feed_button">🍖 Feed</button>
        <button id="btn-play" class="btn" data-i18n="play_button">🎮 Play</button>
      </div>
    </section>

    <!-- 4. Pomodoro -->
    <section id="screen-pomodoro" class="screen">
      <div class="room-topbar">
        <button id="pomodoro-back" class="icon-btn" title="Back">‹</button>
        <span class="pet-name" data-i18n="pomodoro_heading">Pomodoro</span>
      </div>

      <div class="mode-tabs">
        <button class="mode-tab active" data-mode="pomodoro" data-i18n="mode_pomodoro">Pomodoro</button>
        <button class="mode-tab" data-mode="short" data-i18n="mode_short">Short Break</button>
        <button class="mode-tab" data-mode="long" data-i18n="mode_long">Long Break</button>
      </div>

      <div class="timer-display" id="timer-display">25:00</div>

      <div class="timer-actions">
        <button id="timer-reset" class="icon-btn" title="Reset">↺</button>
        <button id="timer-toggle" class="btn" data-i18n="start_timer_button">Start</button>
      </div>

      <div class="task-section">
        <h2 class="section-title" data-i18n="tasks_heading">Tasks</h2>
        <div class="task-list" id="task-list"></div>
        <button id="task-add" class="task-add" data-i18n="add_task_button">+ Add Task</button>
      </div>
    </section>

    <!-- shared pet engine + app -->
    <script src="../desktop/chrome-shim.js"></script>
    <script src="../content/sprite.js"></script>
    <script src="../content/pet.js"></script>
    <script src="../content/input.js"></script>
    <script src="stats.js"></script>
    <script src="pomodoro.js"></script>
    <script src="alarm.js"></script>
    <script src="room.js"></script>
    <script src="app.js"></script>
  </body>
</html>
