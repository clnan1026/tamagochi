<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Tamagotchi</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: transparent;
      }
      .pet {
        position: fixed;
        top: 0;
        left: 0;
        width: 64px;
        height: 64px;
        background-repeat: no-repeat;
        background-size: 256px 64px;
        image-rendering: pixelated;
        pointer-events: auto;
        cursor: grab;
        user-select: none;
        -webkit-user-select: none;
        touch-action: none;
        will-change: transform;
      }
      .pet:active {
        cursor: grabbing;
      }
      .bubble {
        position: fixed;
        top: 0;
        left: 0;
        padding: 4px 8px;
        border-radius: 8px;
        background: #fffbe8;
        color: #2b2b2b;
        border: 2px solid #2b2b2b;
        /* The bundled pixel font has no Japanese glyphs; lean on the system stack. */
        font: 13px/1.3 -apple-system, "Hiragino Sans", "Yu Gothic", Meiryo,
          "Noto Sans JP", "Apple Color Emoji", "Segoe UI Emoji", sans-serif;
        white-space: nowrap;
        pointer-events: none;
        opacity: 0;
        transition: opacity 140ms ease-out;
        will-change: transform, opacity;
      }
      .bubble.visible {
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <script src="chrome-shim.js"></script>
    <script src="../content/sprite.js"></script>
    <script src="../content/pet.js"></script>
    <script src="../content/input.js"></script>
    <script src="overlay-desktop.js"></script>
  </body>
</html>
